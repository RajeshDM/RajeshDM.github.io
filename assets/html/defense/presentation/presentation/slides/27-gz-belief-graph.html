<!DOCTYPE html>

<style>
/* === Original viz styles === */

*{margin:0;padding:0;box-sizing:border-box}

button{font-family:inherit}



/* === Presentation chrome overrides === */
html,body{font-family:'Source Sans 3',sans-serif !important}

/* Fixed aspect ratio presentation slide */
.pres-wrapper{
  display:flex;flex-direction:column;
  width:min(100vw, 177.78vh); /* 16:9 width */
  height:min(100vh, 56.25vw); /* 16:9 height */
  background:#fff;
  box-shadow:0 2px 20px rgba(0,0,0,.15);
  overflow:hidden;
}
.gold-top-bar{height:4px;background:#C5A55A;flex-shrink:0}
.pres-content{flex:1;display:flex;flex-direction:column;min-height:0}

/* Restyle original header fonts */
.pres-content h1,.pres-content [style*="font-size:19px"],.pres-content [style*="font-size:18px"],.pres-content [style*="font-size:20px"],.hdr h1{
  font-family:'Playfair Display',serif !important;color:#2D2044 !important
}

/* Restyle original buttons to match presentation */
.pres-content button,.ctrls button{
  font-family:'Source Sans 3',sans-serif !important;
  background:#2D2044 !important;
  color:rgba(255,255,255,.85) !important;
  border:none !important;
  border-radius:4px !important;
  padding:5px 16px !important;
  font-size:0.75rem !important;
  font-weight:600 !important;
  cursor:pointer !important;
  transition:all .2s !important;
}
.pres-content button:hover{background:#3D2E58 !important;color:#fff !important}
.pres-content button:disabled{opacity:.25 !important;cursor:default !important}

/* Demo button special style */
.pres-content button[id$="demoB"],
.pres-content button[id$="demoB"]{
  background:rgba(197,165,90,.15) !important;
  color:#2D2044 !important;
  border:1.5px solid rgba(197,165,90,.4) !important;
  font-weight:700 !important;
}

/* Restyle dots container */
.pres-content span[id$="dots"]{display:flex;align-items:center;gap:3px}

/* Bottom nav bar */
.nav-bar{height:44px;background:#2D2044;display:flex;align-items:center;flex-shrink:0}
.nav-section{flex:1;text-align:center;padding:12px 0;font-size:0.85rem;font-family:'Source Sans 3',sans-serif;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.03em;position:relative;cursor:default}
.nav-section.active{color:#C5A55A}
.nav-section.active::before{content:'';position:absolute;top:0;left:15%;right:15%;height:3px;background:#C5A55A;border-radius:0 0 2px 2px}

/* Controls area restyle */
.ctrls,.pres-content > div:last-child{
  background:#F8F6FA;border-top:1px solid #E8E4ED;padding:5px 28px !important
}

</style></head><body>
<div class="pres-wrapper">

<div style="text-align:center;padding:4px 16px 0">

</div>
<div style="flex:1;display:flex;gap:6px;padding:3px 8px;min-height:0">

</div>

<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:#6B5B7B"><div style="width:12px;height:8px;border-radius:2px;background:rgba(36,113,163,.13);border:1px solid #2471A3"></div>Action</div>
<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:#6B5B7B"><div style="width:8px;height:8px;border-radius:50%;background:#B08E2A"></div>Object</div>
<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:#6B5B7B"><div style="width:12px;height:8px;border-radius:2px;background:rgba(192,57,43,.13);border:1px solid #C0392B"></div>Attribute</div>
<div style="display:flex;align-items:center;gap:3px;font-size:9px;color:#6B5B7B"><div style="width:12px;height:8px;border-radius:2px;background:rgba(30,132,73,.13);border:1px solid #1E8449;border-style:dashed"></div>Goal</div>
</div>
</div>
<script>
var co={action:'#2471A3',aD:'#E8F0F8',object:'#B08E2A',oD:'#FDF6E3',pred:'#C0392B',pD:'#FDECEA',goal:'#1E8449',gD:'#E3F5EC',text:'#2E1A38',muted:'#6B5B7B',dim:'#C0A8CC',robot:'#7B5E99',rD:'#4A3360',pkg:'#D68910',pkD:'#B7770A',floor:'#F0EDF3',border:'#D4CDE0',wall:'#5C4A6E',fog:'#2E1A38',shelf:'#8B7FA0',shB:'#6B5B7B',particle:'#7C4DFF',threshold:'#E67E22',zero:'#B71C1C'};
var tC={object:co.object,attribute:co.pred,goal:co.goal,action:co.action},tD={object:co.oD,attribute:co.pD,goal:co.gD,action:co.aD};
var CW=125,CH=80,GA=6,VW=270,GW=CW*2+GA,GH=CH*2+GA,GX=(VW-GW)/2,GY=4,DH=9;
var ShW=28,ShH=3,PkW=22,PkH=15;
var cls=[{id:'a',r:0,c:0},{id:'b',r:0,c:1},{id:'c',r:1,c:0},{id:'d',r:1,c:1}].map(function(c){var x=GX+c.c*(CW+GA),y=GY+c.r*(CH+GA);return{id:c.id,x:x,y:y,cx:x+CW/2,cy:y+CH/2,ri:x+CW,bo:y+CH};});
var CM={};cls.forEach(function(c){CM[c.id]=c;});
function sfp(c){return{x:c.cx-ShW/2,y:c.y+10};}function pkp(c){var s=sfp(c);return{x:c.cx-PkW/2,y:s.y+ShH+2};}function cc(id){return{x:CM[id].cx,y:CM[id].cy+5};}
var PP=pkp(CM.c),GP=pkp(CM.d);

function drawBase(withWalls){
  var s='<defs><pattern id="tl'+(withWalls?'w':'')+'" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="'+co.floor+'"/><line x1="0" y1="12" x2="12" y2="12" stroke="'+co.border+'" stroke-width=".2" opacity=".2"/><line x1="12" y1="0" x2="12" y2="12" stroke="'+co.border+'" stroke-width=".2" opacity=".2"/></pattern>'+(withWalls?'<radialGradient id="fogG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="'+co.fog+'" stop-opacity=".45"/><stop offset="100%" stop-color="'+co.fog+'" stop-opacity=".75"/></radialGradient>':'')+'</defs>';
  s+='<rect x="'+(GX-1)+'" y="'+(GY-1)+'" width="'+(GW+2)+'" height="'+(GH+2)+'" rx="3" fill="none" stroke="'+co.border+'" stroke-width=".7"/>';
  cls.forEach(function(c){s+='<rect x="'+c.x+'" y="'+c.y+'" width="'+CW+'" height="'+CH+'" rx="2" fill="url(#tl'+(withWalls?'w':'')+')" stroke="'+co.border+'" stroke-width=".3"/>';s+='<text x="'+c.cx+'" y="'+(c.bo-3)+'" text-anchor="middle" fill="'+co.muted+'" font-size="9" font-weight="600">Zone '+'ABCD'['abcd'.indexOf(c.id)]+'</text>';if(c.id==='c'||c.id==='d'){var sp=sfp(c);s+='<g opacity=".4"><rect x="'+sp.x+'" y="'+sp.y+'" width="'+ShW+'" height="'+ShH+'" rx="1" fill="'+co.shelf+'" stroke="'+co.shB+'" stroke-width=".3"/></g>';}});
  if(withWalls){[{f:'a',t:'b',d:'h'},{f:'a',t:'c',d:'v'},{f:'b',t:'d',d:'v'},{f:'c',t:'d',d:'h'}].forEach(function(adj){var a=CM[adj.f];if(adj.d==='h'){var wx=a.ri,wy=a.y,wh=a.bo-a.y,dcy=wy+wh/2;s+='<rect x="'+wx+'" y="'+wy+'" width="'+GA+'" height="'+(dcy-DH-wy)+'" fill="'+co.wall+'" rx="1"/><rect x="'+wx+'" y="'+(dcy+DH)+'" width="'+GA+'" height="'+(wy+wh-dcy-DH)+'" fill="'+co.wall+'" rx="1"/>';}else{var wy2=a.bo,wx2=a.x,ww=a.ri-a.x,dcx=wx2+ww/2;s+='<rect x="'+wx2+'" y="'+wy2+'" width="'+(dcx-DH-wx2)+'" height="'+GA+'" fill="'+co.wall+'" rx="1"/><rect x="'+(dcx+DH)+'" y="'+wy2+'" width="'+(wx2+ww-dcx-DH)+'" height="'+GA+'" fill="'+co.wall+'" rx="1"/>';}});s+='<rect x="'+cls[0].ri+'" y="'+cls[0].bo+'" width="'+GA+'" height="'+GA+'" fill="'+co.wall+'" rx="1"/>';}
  else{[{f:'a',d:'h'},{f:'a',d:'v'},{f:'b',d:'v'},{f:'c',d:'h'}].forEach(function(j){var a=CM[j.f];if(j.d==='h')s+='<line x1="'+(a.ri+GA/2)+'" y1="'+(a.y+2)+'" x2="'+(a.ri+GA/2)+'" y2="'+(a.bo-2)+'" stroke="'+co.dim+'" stroke-width=".3" stroke-dasharray="3 2" opacity=".25"/>';else s+='<line x1="'+(a.x+2)+'" y1="'+(a.bo+GA/2)+'" x2="'+(a.ri-2)+'" y2="'+(a.bo+GA/2)+'" stroke="'+co.dim+'" stroke-width=".3" stroke-dasharray="3 2" opacity=".25"/>';});}
  return s;
}

var STAGES=[{t:'The Problem',s:'Same task, but walls block the robot\'s view. Partial observability.'},{t:'Step 1 \u2014 Particle Belief',s:'The belief b is a set of weighted particles, each a complete possible world state'},{t:'Step 2 \u2014 Belief Aggregation',s:'Sum particle weights per attribute-value pair to compute belief probabilities'},{t:'Step 3 \u2014 Object Nodes',s:'Every entity becomes a persistent object node'},{t:'Step 4a \u2014 Certain Attributes',s:'Attributes with belief = 1.0 become nodes with full-weight edges.'},{t:'Step 4b \u2014 Uncertain Attributes (\u03c4)',s:'Attributes with belief \u2265 \u03c4 (but < 1) added. Edge thickness \u221d belief probability.'},{t:'Step 5 \u2014 Instantiated Actions',s:'Grounded actions (Move, Look) connected to their argument objects.'},{t:'Step 6 \u2014 Goal Node',s:'Goal predicate On(Pkg,D) added, completing the belief graph.'}];
var maxS=7;
var PARTICLES=[{id:'s\u2081',w:.40,pkg:'B',c:'#E65100'},{id:'s\u2082',w:.35,pkg:'C',c:'#7C4DFF'},{id:'s\u2083',w:.25,pkg:'D',c:'#00897B'},{id:'s\u2084',w:.00,pkg:'A',c:'#B0BEC5'}];
var AGG=[{a:'At(Bot)',v:[{val:'A',p:1.0}]},{a:'HandEmpty',v:[{val:'true',p:1.0}]},{a:'At(Pkg)',v:[{val:'B',p:.40},{val:'C',p:.35},{val:'D',p:.25},{val:'A',p:.00}]}];
var TAU=.3;
var GN=[{id:'robot',x:55,y:155,l:'Robot',t:'object',s:3},{id:'rm_a',x:145,y:155,l:'Zone A',t:'object',s:3},{id:'rm_b',x:245,y:155,l:'Zone B',t:'object',s:3},{id:'rm_c',x:345,y:155,l:'Zone C',t:'object',s:3},{id:'pkg',x:445,y:155,l:'Pkg',t:'object',s:3},{id:'rm_d',x:545,y:155,l:'Zone D',t:'object',s:3},{id:'at_bot',x:85,y:260,l:'At(Bot)=A',t:'attribute',s:4,p:1.0},{id:'hand_e',x:235,y:260,l:'HandEmpty',t:'attribute',s:4,p:1.0},{id:'pkg_b',x:400,y:260,l:'At(Pkg)=B',t:'attribute',s:5,p:.40},{id:'pkg_c',x:555,y:260,l:'At(Pkg)=C',t:'attribute',s:5,p:.35},{id:'goal_pkg',x:545,y:325,l:'On(Pkg,D)',t:'goal',s:7},{id:'move_ab',x:75,y:42,l:'Move(A\u2192B)',t:'action',s:6},{id:'move_ac',x:215,y:42,l:'Move(A\u2192C)',t:'action',s:6},{id:'look_b',x:365,y:42,l:'Look(B)',t:'action',s:6},{id:'look_c',x:505,y:42,l:'Look(C)',t:'action',s:6}];
var GE=[{f:'at_bot',t:'robot',s:4,ty:'attribute',w:1},{f:'at_bot',t:'rm_a',s:4,ty:'attribute',w:1},{f:'hand_e',t:'robot',s:4,ty:'attribute',w:1},{f:'pkg_b',t:'pkg',s:5,ty:'attribute',w:.4},{f:'pkg_b',t:'rm_b',s:5,ty:'attribute',w:.4},{f:'pkg_c',t:'pkg',s:5,ty:'attribute',w:.35},{f:'pkg_c',t:'rm_c',s:5,ty:'attribute',w:.35},{f:'goal_pkg',t:'pkg',s:7,ty:'goal'},{f:'goal_pkg',t:'rm_d',s:7,ty:'goal'},{f:'move_ab',t:'robot',s:6,ty:'action'},{f:'move_ab',t:'rm_a',s:6,ty:'action'},{f:'move_ab',t:'rm_b',s:6,ty:'action'},{f:'move_ac',t:'robot',s:6,ty:'action'},{f:'move_ac',t:'rm_a',s:6,ty:'action'},{f:'move_ac',t:'rm_c',s:6,ty:'action'},{f:'look_b',t:'robot',s:6,ty:'action'},{f:'look_b',t:'rm_b',s:6,ty:'action'},{f:'look_c',t:'robot',s:6,ty:'action'},{f:'look_c',t:'rm_c',s:6,ty:'action'}];
var NM={};GN.forEach(function(n){NM[n.id]=n;});
var stage=0,demoActive=false,demoTimers=[],demoState=null,visited=new Set(['a']);
document.getElementById('nextB').onclick=function(){if(!demoActive&&stage<maxS){stage++;ren();}};
document.getElementById('prevB').onclick=function(){if(!demoActive&&stage>0){stage--;ren();}};
document.getElementById('demoB').onclick=runDemo;

function runDemo(){if(demoActive)return;demoActive=true;visited=new Set(['a']);var pA=cc('a'),pB=cc('b'),pC=cc('c'),pD=cc('d');var init={rx:pA.x,ry:pA.y,facing:1,held:false,placed:false,phase:'start',done:false};demoState=init;var steps=[[0,init],[300,{phase:'searching'}],[400,{rx:pB.x,ry:pB.y,visit:'b'}],[1400,{phase:'empty_b'}],[1900,{rx:pA.x,ry:pA.y,facing:-1,phase:'searching'}],[2500,{rx:pC.x,ry:pC.y,visit:'c',facing:1,phase:'found'}],[3200,{phase:'reaching',facing:0}],[3600,{held:true,phase:'grabbing'}],[3900,{phase:'holding',facing:1}],[4200,{rx:pD.x,ry:pD.y,visit:'d',phase:'moving'}],[5100,{phase:'placing',facing:0}],[5500,{held:false,placed:true}],[5800,{done:true,phase:'done',facing:1}],[7200,null]];demoTimers=steps.map(function(s){return setTimeout(function(){if(!s[1]){demoActive=false;demoState=null;visited=new Set(['a']);ren();return;}demoState=Object.assign({},demoState||init,s[1]);if(s[1].visit)visited.add(s[1].visit);ren();},s[0]);});}

function ren(){
  document.getElementById('stT').textContent=STAGES[stage].t;document.getElementById('stS').textContent=STAGES[stage].s;
  document.getElementById('prevB').disabled=stage===0||demoActive;document.getElementById('nextB').disabled=stage===maxS||demoActive;
  document.getElementById('demoB').style.display=(!demoActive&&stage===0)?'inline-block':'none';document.getElementById('demoL').style.display=demoActive?'inline':'none';
  var dots='';for(var i=0;i<=maxS;i++)dots+='<span style="width:'+(i===stage?9:6)+'px;height:'+(i===stage?9:6)+'px;border-radius:50%;display:inline-block;margin:0 2px;background:'+(i===stage?co.text:i<stage?co.muted:co.dim)+'"></span>';document.getElementById('dots').innerHTML=dots;
  var da=demoActive,ds=demoState,robX=da?ds.rx:cc('a').x,robY=da?ds.ry:cc('a').y,facing=da?(ds.facing||1):1,held=da&&ds.held,placed=da&&ds.placed;
  var showPkgC=da?(!held&&!placed):true,showPkgD=da&&placed&&!held;
  // Start state
  var s=drawBase(true);
  cls.forEach(function(c){var vis2=c.id==='a'||(da&&visited.has(c.id));if(vis2)return;var probs={b:.40,c:.35,d:.25};s+='<rect x="'+(c.x+1)+'" y="'+(c.y+1)+'" width="'+(CW-2)+'" height="'+(CH-2)+'" fill="url(#fogG)" rx="2"/>';s+='<text x="'+c.cx+'" y="'+(c.cy-1)+'" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" opacity=".5">?</text>';s+='<text x="'+c.cx+'" y="'+(c.cy+10)+'" text-anchor="middle" fill="#fff" font-size="9" opacity=".5">p = '+probs[c.id]+'</text>';});
  if(da&&ds&&ds.phase==='empty_b'&&visited.has('b'))s+='<rect x="'+(CM.b.cx-18)+'" y="'+(CM.b.y+8)+'" width="36" height="13" rx="3" fill="#fff" stroke="'+co.pred+'" stroke-width=".8"/><text x="'+CM.b.cx+'" y="'+(CM.b.y+18)+'" text-anchor="middle" fill="'+co.pred+'" font-size="8" font-weight="700">Empty!</text>';
  if(da&&ds&&ds.phase==='found'&&visited.has('c'))s+='<rect x="'+(CM.c.cx+PkW/2+4)+'" y="'+(PP.y)+'" width="36" height="13" rx="3" fill="#fff" stroke="'+co.goal+'" stroke-width=".8"/><text x="'+(CM.c.cx+PkW/2+22)+'" y="'+(PP.y+10)+'" text-anchor="middle" fill="'+co.goal+'" font-size="8" font-weight="700">Found!</text>';
  if(showPkgC&&!(da&&!visited.has('c'))&&!(!da))s+='<rect x="'+PP.x+'" y="'+PP.y+'" width="'+PkW+'" height="'+PkH+'" rx="2" fill="'+co.pkg+'" stroke="'+co.pkD+'" stroke-width=".6"/><text x="'+(PP.x+PkW/2)+'" y="'+(PP.y+PkH/2+3)+'" text-anchor="middle" fill="#fff" font-size="6" font-weight="700">PKG</text>';
  if(showPkgD)s+='<rect x="'+GP.x+'" y="'+GP.y+'" width="'+PkW+'" height="'+PkH+'" rx="2" fill="'+co.pkg+'" stroke="'+co.pkD+'" stroke-width=".6"/><text x="'+(GP.x+PkW/2)+'" y="'+(GP.y+PkH/2+3)+'" text-anchor="middle" fill="#fff" font-size="6" font-weight="700">PKG</text>';
  if(!showPkgD)s+='<rect x="'+GP.x+'" y="'+GP.y+'" width="'+PkW+'" height="'+PkH+'" rx="2" fill="'+co.gD+'" stroke="'+co.goal+'" stroke-width="1.2" stroke-dasharray="3 2" opacity=".5"/><text x="'+(GP.x+PkW/2)+'" y="'+(GP.y+PkH/2+2)+'" text-anchor="middle" fill="'+co.goal+'" font-size="5" font-weight="700" opacity=".6">GOAL</text>';
  if(da&&ds&&ds.done)s+='<circle cx="'+CM.d.cx+'" cy="'+(GP.y+PkH+8)+'" r="5" fill="'+co.goal+'" opacity=".9"/>';
  s+='<text x="'+(VW/2)+'" y="190" text-anchor="middle" fill="'+co.dim+'" font-size="9.5" font-weight="600">Robot in A, package location unknown</text>';
  document.getElementById('startBg').innerHTML=s;
