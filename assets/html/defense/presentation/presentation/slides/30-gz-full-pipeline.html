<script>
(function(){
var cur=0,tot=5,root=document.getElementById('S');

function show(n){document.querySelectorAll('.ms[data-step="'+n+'"],.fa[data-step="'+n+'"]').forEach(function(e){e.classList.add('shown')})}
function hide(n){document.querySelectorAll('.ms[data-step="'+n+'"],.fa[data-step="'+n+'"]').forEach(function(e){e.classList.remove('shown')})}



  // Expose nav to parent scope
  window.__slideNav = {
    advance: function() { var s = cur; if(cur<tot){cur++;show(cur)}; return cur !== s; },
    retreat: function() { var s = cur; if(cur>0){hide(cur);cur--}; return cur !== s; },
    revealAll: function() { while(window.__slideNav.advance()) {} }
  };

})();
</script>





<script>
// ═══ Unified PPT-style navigation ═══
(function(){
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      if (window.__slideNav && !window.__slideNav.advance()) {
        try { window.parent.postMessage({type:'boundary',direction:'next'},'*'); } catch(err) {}
      }
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (window.__slideNav && !window.__slideNav.retreat()) {
        try { window.parent.postMessage({type:'boundary',direction:'prev'},'*'); } catch(err) {}
      }
    } else if (e.key === 'a' || e.key === 'A') {
      if (window.__slideNav) window.__slideNav.revealAll();
    } else if ('fFpPtTbB?'.indexOf(e.key)>=0 || e.key === 't' || e.key === 'T' || e.key === '?' || e.key === 'b' || e.key === 'B') {
      try { window.parent.postMessage({type:'passthrough',key:e.key},'*'); } catch(err) {}
    }
  });
  document.addEventListener('click', function(e) {
    if (e.target.closest && (e.target.closest('.nav-bar') || e.target.closest('.nav-section') || e.target.closest('button'))) return;
    if (e.clientX < window.innerWidth * 0.35) {
      if (window.__slideNav && !window.__slideNav.retreat()) {
        try { window.parent.postMessage({type:'boundary',direction:'prev'},'*'); } catch(err) {}
      }
    } else {
      if (window.__slideNav && !window.__slideNav.advance()) {
        try { window.parent.postMessage({type:'boundary',direction:'next'},'*'); } catch(err) {}
      }
    }
  });
})();

// Nav bar section clicks -> jump to section
document.querySelectorAll('.nav-section, .nav-item').forEach(function(el) {
  el.style.cursor = 'pointer';
  el.addEventListener('click', function(e) {
    e.stopPropagation();
    var section = this.textContent.trim();
    try { window.parent.postMessage({type:'navSection', section:section}, '*'); } catch(err) {}
  });
});
</script>
